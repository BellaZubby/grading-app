<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Student Grading Tool</title>
        <link rel="stylesheet" href="styles.css"></link>
    </head>
    <body>
        <div class="container">
            <h1 class="title">STUDENT GRADING TOOL</h1>
            
            <div class="inputBoxes">
                <div class="nameBox">
                    <input id="studentName" placeholder="Enter Student Name"/>
                    <span id="nameErrorMsg"></span>
                </div>
               <div class="scoreBox">
                <textarea id="scoresInput" rows="5" cols="30" placeholder="Type scores here: Maximum 100, one score per line (e.g., 75, 55)"></textarea>
                <span id="errorMessage"></span>
               </div>
            </div>
            
            <button id="averageButton">Get Average</button>
            <div class="result">
                <div class="averageGrade">
                    <p>Student Average: <strong><span id="studentAverage"></span></strong></p>
                    <p>Student Grade: <strong><span id="studentGrade"></span></strong></p>
                </div>
               <p>Remark: <strong><span id="teacherRemark"></span></strong></p>
            </div>
            <div class="newEntry">
                <button id="newEntry">New Entry</button>
            </div>
           
        </div>
        <script src="index.js"></script>
    </body>
</html>
